<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bg_fish_swordfish" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F2028"/>
      <stop offset="100%" stop-color="#0E0F14"/>
    </radialGradient>
    <linearGradient id="glow_fish_swordfish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow_fish_swordfish">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3B82F6" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="96" height="96" x="2" y="2" rx="16" fill="url(#bg_fish_swordfish)" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Ambient Wave Motif -->
  <path d="M15 75 Q 35 68, 50 75 T 85 75" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.2"/>
  <path d="M15 82 Q 35 75, 50 82 T 85 82" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.15"/>
  <!-- Stylized Fish Shape -->
  <g filter="url(#shadow_fish_swordfish)" transform="translate(10, 16) scale(0.8)">
    <!-- Caudal Fin / Tail -->
    <path d="M 18 40 L 2 24 C 8 36, 8 44, 2 56 Z" fill="url(#glow_fish_swordfish)"/>
    <!-- Dorsal Fin -->
    <path d="M 42 22 C 55 12, 68 18, 62 26 Z" fill="#3B82F6" fill-opacity="0.6"/>
    <!-- Pelvic / Anal Fin -->
    <path d="M 38 56 C 48 64, 58 60, 52 54 Z" fill="#3B82F6" fill-opacity="0.5"/>
    <!-- Main Body -->
    <path d="M 18 40 C 25 24, 60 22, 78 40 C 60 58, 25 56, 18 40 Z" fill="url(#glow_fish_swordfish)"/>
    <!-- Scale Accents -->
    <path d="M 38 34 Q 44 40, 38 46" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.5"/>
    <path d="M 46 32 Q 52 40, 46 48" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M 54 36 Q 60 40, 54 44" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7"/>
    <!-- Eye -->
    <circle cx="70" cy="36" r="3.5" fill="#FFFFFF"/>
    <circle cx="71" cy="36" r="1.8" fill="#000000"/>
  </g>
  <circle cx="86" cy="14" r="3" fill="#3B82F6"/>
</svg>